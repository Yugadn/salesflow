name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  sqlc:
    name: generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: for s in master order warehouse billing; do (cd services/$s && sqlc diff) || exit 1; done

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Integration tests start PostgreSQL and RabbitMQ with testcontainers.
      - run: go test -race -tags integration -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  web:
    name: frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end + chaos
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: docker compose -f deploy/docker-compose.yml up -d --build --wait
      - run: E2E_CHAOS=1 go test -tags e2e -count=1 -v ./e2e
      # The seed tool drives the web gateway (nginx) end to end, so this also
      # checks the frontend container proxies every service correctly.
      - run: go run ./tools/seed
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
