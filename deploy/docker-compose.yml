name: salesflow

# nginx (web, :3000) is the only public entry point: it serves the app and
# forwards /api/ to the KrakenD gateway, which is internal like every service.
# PostgreSQL and RabbitMQ are published only for local inspection.

x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20

x-amqp-env: &amqp-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  RETRY_DELAY: 3s

x-jwks-env: &jwks-env
  JWKS_URL: http://auth:8085/.well-known/jwks.json

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salesflow
      POSTGRES_PASSWORD: salesflow
    ports: ["15432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    <<: *service
    build: { context: .., args: { SERVICE: auth } }
    environment:
      DATABASE_URL: postgres://salesflow:salesflow@postgres:5432/auth_db?sslmode=disable
      # The first admin, created on an empty database. Change it for anything but local use.
      ADMIN_EMAIL: admin@salesflow.local
      ADMIN_PASSWORD: admin12345
    depends_on:
      postgres: { condition: service_healthy }

  master:
    <<: *service
    build: { context: .., args: { SERVICE: master } }
    environment:
      <<: *jwks-env
      DATABASE_URL: postgres://salesflow:salesflow@postgres:5432/master_db?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  order:
    <<: *service
    build: { context: .., args: { SERVICE: order } }
    environment:
      <<: [*amqp-env, *jwks-env]
      DATABASE_URL: postgres://salesflow:salesflow@postgres:5432/order_db?sslmode=disable
      MASTER_URL: http://master:8081
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      master: { condition: service_healthy }

  warehouse:
    <<: *service
    build: { context: .., args: { SERVICE: warehouse } }
    environment:
      <<: [*amqp-env, *jwks-env]
      DATABASE_URL: postgres://salesflow:salesflow@postgres:5432/warehouse_db?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  billing:
    <<: *service
    build: { context: .., args: { SERVICE: billing } }
    environment:
      <<: [*amqp-env, *jwks-env]
      DATABASE_URL: postgres://salesflow:salesflow@postgres:5432/billing_db?sslmode=disable
      BUSINESS_TIMEZONE: Asia/Jakarta
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  gateway:
    image: devopsfaith/krakend:2.9.4
    restart: unless-stopped
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    environment:
      FC_ENABLE: "1"
      FC_SETTINGS: /etc/krakend/settings
    volumes:
      - ./krakend:/etc/krakend:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      auth: { condition: service_healthy }
      master: { condition: service_healthy }
      order: { condition: service_healthy }
      warehouse: { condition: service_healthy }
      billing: { condition: service_healthy }

  web:
    build: { context: ../web }
    restart: unless-stopped
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pgdata:
