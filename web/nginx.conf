server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every API call goes through the KrakenD gateway, which authenticates it
    # and routes /api/<service>/... to that service. Same as the Vite dev proxy.
    # The client's own X-Real-IP / X-Forwarded-For are overwritten, never
    # passed on: the gateway rate-limits on X-Real-IP, so it must be the real
    # peer address and not something the client chose.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }
}
