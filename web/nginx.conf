server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same routing as the Vite dev proxy: /api/<service>/... -> that service.
    # The trailing slash on proxy_pass strips the /api/<service> prefix.
    location /api/master/    { proxy_pass http://master:8081/; }
    location /api/order/     { proxy_pass http://order:8082/; }
    location /api/warehouse/ { proxy_pass http://warehouse:8083/; }
    location /api/billing/   { proxy_pass http://billing:8084/; }

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }
}
